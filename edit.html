<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Edit program pages – MAA's Inspiration</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;background:#f4f2f7;color:#2E2438;font-size:17px;line-height:1.5}
h1,h2,h3{font-family:Sora,sans-serif;margin:0}
.top{position:sticky;top:0;z-index:10;background:#3D1A6E;color:#fff;padding:14px 16px 12px}
.top h1{font-size:1.25rem}.bar{height:12px;background:#ffffff33;border-radius:8px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:#E0A526;width:0;transition:width .3s}
#prog{font-size:.95rem}
.help{max-width:820px;margin:14px auto 0;padding:14px 16px;background:#fff;border-radius:14px;border-left:6px solid #E0A526;font-size:1.05rem}
.tabs{max-width:820px;margin:14px auto;display:flex;gap:8px;padding:0 12px}.tabs button{flex:1;padding:14px 8px;border-radius:14px;border:2px solid #ccc;background:#fff;font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{border-color:#5B2A86;background:#5B2A86;color:#fff}.tabs button[data-p=bsv].on{background:#4F6B3A;border-color:#4F6B3A}
main{max-width:820px;margin:0 auto;padding:0 12px 60px}
.sec{border-radius:16px;margin:14px 0;padding:18px;background:#fff;box-shadow:0 2px 10px #0000000d;border-top:6px solid var(--c)}
.mp{--c:#5B2A86;--d:#3D1A6E;--bg:#F6F1FB}.bsv{--c:#4F6B3A;--d:#2F4224;--bg:#F5EFE3}
.sec.hero{background:linear-gradient(135deg,var(--d),var(--c));color:#fff}.sec.hero .lab{color:#fff}
.sec.done{opacity:.85;border-top-color:#2e9d4f}
.lab{font-family:Sora,sans-serif;font-weight:700;color:var(--d);font-size:1.05rem;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tag{font-size:.75rem;padding:2px 8px;border-radius:10px;background:#eee;color:#555;font-family:'DM Sans'}.tag.ed{background:#E9DDF5;color:#3D1A6E}.tag.ok{background:#d8f2df;color:#1f7a3b}
.need{background:#FFE57A;color:#5a4300;border-radius:10px;padding:8px 12px;margin:10px 0 0;font-weight:600}
.txt{margin:12px 0;padding:12px;border:2px dashed transparent;border-radius:10px;background:var(--bg);color:#2E2438;min-height:2.6em;white-space:pre-wrap;outline:none;position:relative}
.txt:hover,.txt:focus{border-color:var(--c);background:#fff}.txt:empty:before{content:"Tap here and type the answer";color:#999}
.txt:after{content:"✏️";position:absolute;right:8px;top:6px;opacity:.35}
.hero .txt{background:#ffffff1f;color:#fff}.hero .txt:hover,.hero .txt:focus{background:#ffffff33;border-color:#fff}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns button{flex:1;min-width:130px;padding:14px;border-radius:12px;border:0;font:inherit;font-weight:700;cursor:pointer}
.save{background:var(--c);color:#fff}.ok{background:#E0A526;color:#2E2438}.ok.on{background:#2e9d4f;color:#fff}.hero .save{background:#fff;color:var(--d)}
.orig{font-size:.85rem;color:#777;margin-top:4px}.hero .orig{color:#eee}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#2E2438;color:#fff;padding:10px 18px;border-radius:20px;display:none;z-index:20}
</style></head><body>
<div class="top"><h1>✏️ Edit the program pages</h1><div class="bar"><i id="barfill"></i></div><div id="prog">Loading…</div></div>
<div class="help"><b>Tap any text to change it. Press Save. Press Looks good when a section is right. I'll update the website.</b><br><small>Yellow boxes are questions only you can answer.</small></div>
<div class="tabs"><button data-p="mp" class="on">🏡 Senior Center</button><button data-p="bsv">🌟 Bloom Village</button></div>
<main id="list"></main><div id="msg"></div>
<script>
const API="https://script.google.com/macros/s/AKfycbx1VIE_gWz_2DziRg7AaW53JJQFw0v9vcMrG18Fx-V575O2eAKIrZ3ttDO2CK9jSplzoA/exec";
let S=[],state={},page=location.hash==="#bsv"?"bsv":"mp",pass=localStorage.getItem("maas_pass")||"";
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const toast=t=>{msg.textContent=t;msg.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>msg.style.display="none",2200)};
function progress(){const n=S.length,a=S.filter(s=>state[s.id]?.done).length,z=S.filter(s=>s.need&&!(state[s.id]?.notes&&state[s.id].notes.trim()!==s.text.trim())&&!(state[s.id]?.done&&!s.applied)).length;
 prog.textContent=`${a} of ${n} sections approved · ${z} need your info`;barfill.style.width=(n?100*a/n:0)+"%"}
function render(){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.p===page));
 list.innerHTML=S.filter(s=>s.page===page).map(s=>{const st=state[s.id]||{},ed=!!st.notes&&st.notes.trim()!==s.text.trim(),hero=s.label.startsWith("Top banner");
 return `<div class="sec ${s.page} ${hero?"hero":""} ${st.done?"done":""}" data-id="${s.id}">
 <div class="lab">${esc(s.label)} ${ed?'<span class="tag ed">edited</span>':""}${s.applied&&!ed?'<span class="tag ok">on website ✓</span>':""} ${st.done?'<span class="tag ok">✓ Looks good</span>':""}</div>
 ${s.need&&!st.done?`<div class="need">⚠️ Needs your info: ${esc(s.need)}</div>`:""}
 <div class="txt" contenteditable="true">${esc(ed?st.notes:s.text)}</div>
 ${ed?`<div class="orig">Original: ${esc(s.text||"(empty)")}</div>`:""}
 <div class="btns"><button class="save">💾 Save</button><button class="ok ${st.done?"on":""}">${st.done?"✓ Looks good (tap to undo)":"👍 Looks good"}</button></div></div>`}).join("");progress()}
async function post(body){if(!pass){pass=prompt("Enter the team passcode (once per device):")||"";if(!pass)return null}
 try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,pass})});const j=await r.json();
 if(j.error){if(j.error==="bad passcode"){pass="";localStorage.removeItem("maas_pass");alert("Wrong passcode.")}else alert("Error: "+j.error);return null}
 localStorage.setItem("maas_pass",pass);absorb(j.items);return j}catch(e){alert("Couldn't save – check your internet and try again.");return null}}
function absorb(items){items.forEach(i=>{state[i.id]={done:!!i.done,notes:i.notes||""}})}
list.addEventListener("click",async e=>{const sec=e.target.closest(".sec");if(!sec)return;const id=sec.dataset.id,s=S.find(x=>x.id===id);
 if(e.target.classList.contains("save")){const t=sec.querySelector(".txt").innerText.trim();const notes=(t===s.text.trim())?"":t;
  e.target.textContent="Saving…";if(await post({action:"set",id,notes})){toast(notes?"Saved ✓":"Back to original ✓")}render()}
 if(e.target.classList.contains("ok")){const d=!state[id]?.done;e.target.textContent="Saving…";if(await post({action:"set",id,done:d}))toast(d?"Marked looks good ✓":"Undone");render()}});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{page=b.dataset.p;history.replaceState(null,"","#"+page);render();scrollTo(0,0)});
Promise.all([fetch("edit-sections.json",{cache:"no-store"}).then(r=>r.json()),fetch(API).then(r=>r.json())]).then(([sec,j])=>{S=sec;absorb(j.items);render()})
 .catch(()=>{prog.textContent="Couldn't load – please refresh."});
</script></body></html>
